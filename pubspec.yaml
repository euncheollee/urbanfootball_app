name: urbanfootball_app
description: "UrbanFootball WebView App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # WebView
  webview_flutter: ^4.13.1

  # Firebase
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1

  # Notifications
  flutter_local_notifications: ^17.2.1
  
  # 🔥 추가
  permission_handler: ^11.3.1

  # Utils
  http: ^1.2.0
  shared_preferences: ^2.2.2
  package_info_plus: ^9.0.0
  url_launcher: ^6.2.1

  cupertino_icons: ^1.0.8

  kakao_flutter_sdk: ^1.6.0
  rename: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 🔹 앱 아이콘 자동 생성
  flutter_launcher_icons: ^0.13.1

  # 🔹 스플래시 자동 생성
  flutter_native_splash: ^2.3.10


# 🔹 아이콘 설정
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_ios.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_android_fg.png"

# 🔹 스플래시 설정
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash.png
  android: true
  ios: true
  fullscreen: true


flutter:
  uses-material-design: true
